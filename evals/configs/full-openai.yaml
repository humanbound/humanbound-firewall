# The whole firewall as a deployment runs it: Tier 0 + a local Tier 1 detector + the LLM judge.
# Scores the firewall (use judge-openai.yaml to check the labels). Needs the [tier1] extra.
# Costs tokens; replies are cached under evals/cache/. Key: OPENAI_API_KEY.
name: full-openai
tiers:
  tier1:
    consensus: 1
    detectors:
      - model: protectai/deberta-v3-base-prompt-injection-v2
  tier2: null
  tier3:
    provider: openai
    model: gpt-6-luna
    api_key_env: OPENAI_API_KEY
fail: open
repeats: 3
